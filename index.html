<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d081c">
<title>Our Loy Krathong — Under the Starlight</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Thai:wght@300;400;500&family=Prompt:wght@300;400;500&display=swap');

:root {
  --bg: #080514;
  --rose: #ffb7d5;
  --rose-deep: #f472b6;
  --champagne: #ffe8c2;
  --lavender: #dcc6ff;
  --text: #fff8fc;
  --muted: rgba(255, 240, 248, 0.72);
  --glass: rgba(24, 14, 42, 0.52);
  --glass-strong: rgba(20, 12, 36, 0.76);
  --border: rgba(255, 200, 228, 0.25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Prompt', sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#world {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
}

.vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background: radial-gradient(circle at 50% 42%, transparent 48%, rgba(8, 4, 18, 0.65) 100%);
}

/* Romantic Glass Lobby */
#lobby {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: radial-gradient(circle at 50% 30%, rgba(45, 22, 74, 0.45), rgba(8, 5, 20, 0.72));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: opacity 1.1s ease, visibility 1.1s ease;
}
#lobby.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.lobby-card {
  width: min(430px, 100%);
  background: linear-gradient(160deg, rgba(36, 20, 62, 0.82), rgba(16, 10, 32, 0.9));
  border: 1px solid var(--border);
  border-radius: 32px;
  padding: 38px 28px;
  text-align: center;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75), 0 0 40px rgba(255, 183, 213, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.kicker {
  font-size: 0.7rem;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--rose);
}

h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 400;
  font-style: italic;
  font-size: clamp(2.6rem, 8vw, 3.6rem);
  line-height: 1.05;
  margin: 8px 0 8px;
  background: linear-gradient(110deg, #fff5eb, #ffc4df 55%, #e2caff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 4px 24px rgba(255, 183, 213, 0.38));
}

.subtitle {
  font-family: 'Noto Serif Thai', serif;
  font-size: 0.92rem;
  color: var(--muted);
  font-weight: 300;
  margin-bottom: 26px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

input {
  width: 100%;
  padding: 14px 18px;
  border-radius: 16px;
  border: 1px solid rgba(255, 200, 228, 0.22);
  background: rgba(10, 6, 22, 0.6);
  color: #fff;
  font: inherit;
  font-size: 0.95rem;
  text-align: center;
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s;
}
input:focus {
  border-color: var(--rose);
  box-shadow: 0 0 0 3px rgba(255, 183, 213, 0.18);
}
input::placeholder { color: rgba(255, 230, 242, 0.42); }

.join-row {
  display: flex;
  gap: 8px;
}
.join-row input {
  letter-spacing: 0.24em;
  text-transform: uppercase;
  font-weight: 500;
}

button {
  padding: 14px 20px;
  border-radius: 16px;
  border: 1px solid rgba(255, 220, 238, 0.45);
  background: linear-gradient(125deg, #ffc2de, #e5a8f5 55%, #ffe0b8);
  color: #2b122e;
  font: inherit;
  font-weight: 500;
  font-size: 0.95rem;
  cursor: pointer;
  transition: transform 0.2s, filter 0.2s, box-shadow 0.2s;
  box-shadow: 0 10px 28px rgba(244, 114, 182, 0.25);
}
button:hover {
  filter: brightness(1.06);
  transform: translateY(-1px);
  box-shadow: 0 14px 34px rgba(244, 114, 182, 0.38);
}
button:active { transform: scale(0.98); }

button.ghost {
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(255, 200, 228, 0.24);
  color: var(--text);
  box-shadow: none;
  white-space: nowrap;
}

.divider-text {
  font-size: 0.74rem;
  color: rgba(255, 220, 238, 0.45);
  margin: 4px 0;
  letter-spacing: 0.16em;
}

.status-msg {
  margin-top: 16px;
  font-size: 0.82rem;
  color: var(--champagne);
  min-height: 20px;
}

/* Floating Aesthetic HUD */
#hud {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: max(18px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
  opacity: 0;
  transition: opacity 1.2s ease;
}
#hud.active { opacity: 1; }

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  flex-wrap: wrap;
}

.room-badge {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 9px 16px;
  border-radius: 99px;
  background: var(--glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(14px);
  font-size: 0.8rem;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.2s;
}
.room-badge:hover { border-color: var(--rose); transform: translateY(-1px); }
.room-badge b { color: var(--champagne); letter-spacing: 0.2em; font-weight: 500; }

.presence-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.person-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: 99px;
  background: var(--glass);
  border: 1px solid rgba(255, 200, 228, 0.18);
  backdrop-filter: blur(14px);
  font-size: 0.8rem;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #fda4af;
  box-shadow: 0 0 10px #fda4af;
}
.dot.wait {
  background: #fde68a;
  box-shadow: 0 0 8px #fde68a;
  animation: pulse 1.6s infinite;
}
@keyframes pulse { 50% { opacity: 0.28; } }

/* Poetic Wish Display */
.wish-banner {
  text-align: center;
  max-width: 660px;
  margin: 0 auto;
  padding: 0 16px;
  transition: opacity 0.8s ease;
}
.wish-quote {
  font-family: 'Noto Serif Thai', serif;
  font-size: clamp(1.12rem, 3.4vw, 1.62rem);
  font-weight: 300;
  color: #fff6fa;
  text-shadow: 0 2px 20px rgba(10, 4, 24, 0.9), 0 0 28px rgba(255, 183, 213, 0.5);
  line-height: 1.65;
}
.wish-author {
  font-size: 0.78rem;
  color: var(--rose);
  letter-spacing: 0.14em;
  margin-top: 6px;
}

/* Bottom Aesthetic Dock */
.bottom-dock {
  pointer-events: auto;
  width: min(560px, 100%);
  margin: 0 auto;
  background: var(--glass-strong);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: 14px 16px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.flower-selector {
  display: flex;
  gap: 6px;
  width: 100%;
}
.f-btn {
  flex: 1;
  padding: 8px 6px;
  border-radius: 13px;
  border: 1px solid rgba(255, 200, 228, 0.14);
  background: rgba(255, 255, 255, 0.04);
  color: var(--muted);
  font-size: 0.76rem;
  box-shadow: none;
}
.f-btn.active {
  border-color: var(--rose);
  background: linear-gradient(135deg, rgba(255, 183, 213, 0.22), rgba(220, 198, 255, 0.18));
  color: #fff;
}

.wish-input-row {
  display: flex;
  gap: 8px;
}
.wish-input-row input {
  text-align: left;
  padding: 10px 14px;
  font-size: 0.86rem;
  border-radius: 13px;
}
.wish-input-row button {
  padding: 10px 16px;
  font-size: 0.84rem;
  border-radius: 13px;
  white-space: nowrap;
}

.action-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.icon-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  width: 100%;
  justify-content: flex-end;
}
.mini-btn {
  padding: 8px 12px;
  font-size: 0.76rem;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 200, 228, 0.2);
  color: var(--text);
  box-shadow: none;
}
.mini-btn.heart-btn {
  border-color: rgba(255, 150, 195, 0.4);
  color: #ffc4df;
}
.mini-btn.release {
  background: linear-gradient(125deg, #ffc2de, #e5a8f5 55%, #ffe0b8);
  color: #2b122e;
  border-color: rgba(255, 230, 245, 0.6);
  font-weight: 500;
}
.mini-btn.released {
  background: rgba(255, 183, 213, 0.2);
  border-color: rgba(255, 183, 213, 0.5);
  color: #ffe4f0;
}

.toast {
  position: fixed;
  top: 72px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  padding: 9px 18px;
  border-radius: 99px;
  background: rgba(28, 16, 48, 0.94);
  border: 1px solid var(--rose);
  color: #fff6fa;
  font-size: 0.82rem;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  white-space: nowrap;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="world"></canvas>
<div class="vignette"></div>

<!-- Romantic Glass Lobby -->
<div id="lobby">
  <div class="lobby-card">
    <div class="kicker">Under The Same Starlight</div>
    <h1>Our Loy Krathong</h1>
    <p class="subtitle">ค่ำคืนที่แสงจันทร์ ดอกไม้ และเราสองคนอยู่ด้วยกัน</p>

    <div class="field-group">
      <input id="nickInput" maxlength="16" placeholder="ชื่อเล่นของคุณ ♡">
      <button id="btnCreate">สร้างห้องของเรา ✨</button>
      <div class="divider-text">หรือเข้าร่วมห้อง</div>
      <div class="join-row">
        <input id="codeInput" maxlength="6" placeholder="รหัส 6 ตัว">
        <button id="btnJoin" class="ghost">เข้าร่วม ♡</button>
      </div>
    </div>
    <div class="status-msg" id="lobbyStatus"></div>
  </div>
</div>

<!-- Minimalist Aesthetic HUD -->
<div id="hud">
  <div class="top-bar">
    <div class="room-badge" id="btnCopyRoom" title="แตะเพื่อคัดลอกรหัสห้อง">
      <span>ROOM</span>
      <b id="roomCodeDisplay">------</b>
      <span style="opacity:.65">❐</span>
    </div>
    <div class="presence-pills" id="presenceList"></div>
  </div>

  <div class="wish-banner">
    <div class="wish-quote" id="wishText">แตะผิวน้ำเพื่อโปรยกลีบดอกไม้ · แตะท้องฟ้าเพื่อปล่อยโคมลอย</div>
    <div class="wish-author" id="wishAuthor"></div>
  </div>

  <div class="bottom-dock">
    <div class="flower-selector" id="flowerPicker">
      <button class="f-btn active" data-type="lotus">บัวชมพู</button>
      <button class="f-btn" data-type="sakura">ซากุระ</button>
      <button class="f-btn" data-type="jasmine">มะลิขาว</button>
      <button class="f-btn" data-type="rose">กุหลาบแดง</button>
    </div>

    <div class="wish-input-row">
      <input id="wishInput" maxlength="100" placeholder="เขียนคำอธิษฐานหรือบอกรักสั้น ๆ ...">
      <button id="btnWish">ส่งพร ♡</button>
    </div>

    <div class="action-bar">
      <div class="icon-btns">
        <button class="mini-btn heart-btn" id="btnLoveBurst">ส่งหัวใจ ♥</button>
        <button class="mini-btn" id="btnSound">เพลงกล่อม: ปิด</button>
        <button class="mini-btn" id="btnSavePhoto">ถ่ายภาพคู่</button>
        <button class="mini-btn release" id="btnRelease">ปล่อยกระทงคู่ ✨</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, onValue, push, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjXzpOneHcID1NtKjRWmkNtjdnOe4lYxM",
  authDomain: "oul-loy-krathong.firebaseapp.com",
  databaseURL: "https://oul-loy-krathong-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "oul-loy-krathong",
  storageBucket: "oul-loy-krathong.firebasestorage.app",
  messagingSenderId: "736973709028",
  appId: "1:736973709028:web:51761c7f17a56686fe16f1",
  measurementId: "G-6X6DLCXRQW"
};

const $ = id => document.getElementById(id);
let app, auth, db, uid = null, room = "", myNick = "", myFlower = "lotus";
let roomState = { players: {}, krathongs: {}, wishes: {}, released: {}, heartPulse: 0 };
let wishLoopTimer = null, wishIdx = 0, lastHeartPulse = 0;

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2600);
}

const makeCode = () => Math.random().toString(36).slice(2, 8).toUpperCase();
const safe = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ================= FIREBASE MULTIPLAYER (JOIN TOGETHER) ================= */
async function initFirebase() {
  if (!app) {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);
  }
  if (!auth.currentUser) {
    const cred = await signInAnonymously(auth);
    uid = cred.user.uid;
  } else {
    uid = auth.currentUser.uid;
  }
}

async function joinOrCreateRoom(code, isCreate) {
  myNick = $("nickInput").value.trim().slice(0, 16);
  if (!myNick) {
    $("lobbyStatus").textContent = "ใส่ชื่อเล่นของเธอก่อนนะ ♡";
    return;
  }
  try {
    $("lobbyStatus").textContent = "กำลังเปิดประตูสู่สายน้ำใต้แสงดาว...";
    await initFirebase();
    room = code;
    const roomRef = ref(db, `rooms/${room}`);
    const snap = await get(roomRef);

    if (isCreate) {
      if (snap.exists()) return joinOrCreateRoom(makeCode(), true);
      await set(roomRef, {
        createdAt: serverTimestamp(),
        players: {},
        krathongs: {},
        released: {},
        wishes: {},
        heartPulse: 0
      });
    } else if (!snap.exists()) {
      $("lobbyStatus").textContent = "ไม่พบรหัสห้องนี้ ลองเช็กอีกทีนะ";
      return;
    }

    const playersSnap = await get(ref(db, `rooms/${room}/players`));
    const currentPlayers = playersSnap.val() || {};
    if (!currentPlayers[uid] && Object.keys(currentPlayers).length >= 2) {
      $("lobbyStatus").textContent = "ห้องนี้มีคนลอยด้วยกันครบ 2 คนแล้ว";
      return;
    }

    await update(ref(db, `rooms/${room}`), {
      [`players/${uid}`]: { name: myNick, joinedAt: serverTimestamp() },
      [`krathongs/${uid}`]: { type: myFlower }
    });

    $("roomCodeDisplay").textContent = room;
    $("lobby").classList.add("hidden");
    $("hud").classList.add("active");

    onValue(roomRef, snapshot => {
      roomState = snapshot.val() || { players: {}, krathongs: {}, wishes: {}, released: {}, heartPulse: 0 };
      syncSceneWithRoom();
    });
  } catch (err) {
    $("lobbyStatus").textContent = "เชื่อมต่อไม่สำเร็จ: " + err.message;
  }
}

function syncSceneWithRoom() {
  const players = roomState.players || {};
  const ids = Object.keys(players).slice(0, 2);
  const released = roomState.released || {};

  if (roomState.heartPulse && roomState.heartPulse !== lastHeartPulse) {
    lastHeartPulse = roomState.heartPulse;
    spawnHeartFirework(W * 0.5, H * 0.25);
    spawnFloatingHearts(14);
  }

  let pillsHTML = ids.map((id, i) => `
    <div class="person-pill">
      <span class="dot"></span>
      <span>${i === 0 ? "☾" : "♡"} ${safe(players[id].name)}${id === uid ? " (คุณ)" : ""}</span>
    </div>
  `).join("");

  if (ids.length < 2) {
    pillsHTML += `
      <div class="person-pill">
        <span class="dot wait"></span>
        <span style="opacity:.78">กำลังรออีกคนเข้ามา...</span>
      </div>`;
  }
  $("presenceList").innerHTML = pillsHTML;

  const iReleased = !!released[uid];
  const bothReleased = ids.length >= 2 && ids.every(id => released[id]);
  const btnRel = $("btnRelease");
  if (bothReleased) {
    btnRel.textContent = "ลอยเคียงกันแล้ว ♡";
    btnRel.className = "mini-btn released";
  } else if (iReleased) {
    btnRel.textContent = "รออีกคนปล่อย...";
    btnRel.className = "mini-btn released";
  } else {
    btnRel.textContent = "ปล่อยกระทงคู่ ✨";
    btnRel.className = "mini-btn release";
  }

  const wishArr = Object.values(roomState.wishes || {});
  if (wishArr.length > 0 && !wishLoopTimer) {
    const showNextWish = () => {
      const list = Object.values(roomState.wishes || {});
      if (!list.length) return;
      const item = list[wishIdx % list.length];
      $("wishText").textContent = `“${item.text}”`;
      $("wishAuthor").textContent = `♡ ${item.name}`;
      wishIdx++;
    };
    showNextWish();
    wishLoopTimer = setInterval(showNextWish, 5200);
  }
}

/* ================= ROMANTIC DREAMSCAPE CANVAS ENGINE ================= */
const canvas = $("world");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, DPR = 1;
const ripples = [];
const floatingPetals = [];
const skyLanterns = [];
const fireflies = [];
const fireworks = [];
const floatingHearts = [];
const stars = [];

const heroBoats = [
  { x: 0.41, y: 0.74, targetX: 0.41, targetY: 0.74, phase: 0 },
  { x: 0.59, y: 0.75, targetX: 0.59, targetY: 0.75, phase: 2.2 }
];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (stars.length === 0) {
    for (let i = 0; i < 180; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random() * 0.46,
        r: Math.random() * 1.6 + 0.25,
        a: Math.random(),
        s: 0.006 + Math.random() * 0.016,
        tint: i % 4 === 0 ? "#ffd6e8" : (i % 5 === 0 ? "#e2d1ff" : "#fff9f0")
      });
    }
    for (let i = 0; i < 14; i++) {
      skyLanterns.push({
        x: Math.random(),
        y: 0.06 + Math.random() * 0.36,
        z: 0.35 + Math.random() * 0.7,
        vx: 0.00007 + Math.random() * 0.00011,
        vy: -0.00006 - Math.random() * 0.00009,
        sway: Math.random() * Math.PI * 2
      });
    }
    for (let i = 0; i < 34; i++) {
      fireflies.push({
        x: Math.random(),
        y: 0.38 + Math.random() * 0.58,
        phase: Math.random() * Math.PI * 2,
        speed: 0.012 + Math.random() * 0.02,
        color: i % 2 === 0 ? "255, 225, 165" : "255, 185, 225"
      });
    }
    for (let i = 0; i < 22; i++) {
      floatingPetals.push({
        x: Math.random() * W,
        y: H * (0.5 + Math.random() * 0.48),
        vx: 0.15 + Math.random() * 0.25,
        size: 3 + Math.random() * 3.5,
        rot: Math.random() * Math.PI * 2,
        color: i % 2 === 0 ? "#ffb7d5" : "#ffdce8"
      });
    }
  }
}
window.addEventListener("resize", resize);
resize();

function spawnHeartFirework(cx, cy) {
  const count = 48;
  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 2;
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    fireworks.push({
      x: cx,
      y: cy,
      vx: hx * 0.14,
      vy: hy * 0.14,
      alpha: 1,
      size: 2.2 + Math.random() * 1.4,
      color: i % 2 === 0 ? "#ffb7d5" : "#ffe6a3"
    });
  }
}

function spawnFloatingHearts(count) {
  for (let i = 0; i < count; i++) {
    floatingHearts.push({
      x: W * (0.35 + Math.random() * 0.3),
      y: H * (0.65 + Math.random() * 0.12),
      vy: -0.7 - Math.random() * 0.8,
      vx: (Math.random() - 0.5) * 0.6,
      size: 8 + Math.random() * 8,
      alpha: 0.95
    });
  }
}

canvas.addEventListener("pointerdown", e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const horizon = H * 0.48;

  if (y >= horizon) {
    ripples.push({ x, y, r: 4, alpha: 0.72 });
    for (let i = 0; i < 6; i++) {
      floatingPetals.push({
        x: x + (Math.random() - 0.5) * 28,
        y: y + (Math.random() - 0.5) * 14,
        vx: (Math.random() - 0.3) * 0.4,
        size: 3.2 + Math.random() * 3,
        rot: Math.random() * 6,
        color: i % 2 === 0 ? "#ffb7d5" : "#ffe0ec"
      });
      if (floatingPetals.length > 55) floatingPetals.shift();
    }
  } else {
    skyLanterns.push({
      x: x / W,
      y: y / H,
      z: 0.9,
      vx: (Math.random() - 0.5) * 0.0002,
      vy: -0.00022,
      sway: Math.random() * 6
    });
    if (skyLanterns.length > 28) skyLanterns.shift();
  }
});

const FLOWER_PALETTES = {
  lotus:   { outer: "#f48fb1", inner: "#fce4ec", tip: "#fff5f9", leaf1: "#345e40", leaf2: "#1d3825", aura: "255, 175, 210" },
  sakura:  { outer: "#ffb7d5", inner: "#ffe5f0", tip: "#ffffff", leaf1: "#3d6649", leaf2: "#223d2a", aura: "255, 200, 228" },
  jasmine: { outer: "#e2e8f0", inner: "#ffffff", tip: "#fefce8", leaf1: "#32593d", leaf2: "#1b3322", aura: "255, 245, 210" },
  rose:    { outer: "#e11d48", inner: "#fb7185", tip: "#ffe4e6", leaf1: "#2c4f36", leaf2: "#172e1e", aura: "255, 135, 165" }
};

function drawHeartShape(ctx, x, y, size, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, size * 0.3);
  ctx.bezierCurveTo(-size * 0.5, -size * 0.3, -size, size * 0.2, 0, size);
  ctx.bezierCurveTo(size, size * 0.2, size * 0.5, -size * 0.3, 0, size * 0.3);
  ctx.fill();
  ctx.restore();
}

function drawRealisticKrathong(ctx, cx, cy, scale, type, label, time, phase) {
  const pal = FLOWER_PALETTES[type] || FLOWER_PALETTES.lotus;
  const bobY = Math.sin(time * 2.0 + phase) * 3.8 * scale;
  const tilt = Math.sin(time * 1.5 + phase) * 0.032;

  ctx.save();
  ctx.translate(cx, cy + bobY);

  ctx.save();
  ctx.scale(1, 0.34);
  const waterGlow = ctx.createRadialGradient(0, 34 * scale, 2, 0, 34 * scale, 105 * scale);
  waterGlow.addColorStop(0, "rgba(255, 225, 155, 0.58)");
  waterGlow.addColorStop(0.45, `rgba(${pal.aura}, 0.22)`);
  waterGlow.addColorStop(1, "rgba(255, 165, 80, 0)");
  ctx.fillStyle = waterGlow;
  ctx.beginPath();
  ctx.arc(0, 34 * scale, 105 * scale, 0, Math.PI * 2);
  ctx.fill();

  const ringPhase = (time * 0.55 + phase) % 1;
  ctx.strokeStyle = `rgba(255, 225, 240, ${(1 - ringPhase) * 0.3})`;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(0, 22 * scale, (38 + ringPhase * 58) * scale, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = "rgba(6, 3, 16, 0.58)";
  ctx.beginPath();
  ctx.ellipse(0, 12 * scale, 48 * scale, 11 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(tilt);
  ctx.scale(scale, scale);

  const baseGrad = ctx.createLinearGradient(0, -4, 0, 18);
  baseGrad.addColorStop(0, pal.leaf1);
  baseGrad.addColorStop(1, pal.leaf2);
  ctx.fillStyle = baseGrad;
  ctx.beginPath();
  ctx.moveTo(-46, -2);
  ctx.lineTo(46, -2);
  ctx.lineTo(36, 15);
  ctx.quadraticCurveTo(0, 20, -36, 15);
  ctx.closePath();
  ctx.fill();

  for (let i = -4; i <= 4; i++) {
    const px = i * 10.5;
    const h = 13 - Math.abs(i) * 0.7;
    ctx.fillStyle = i % 2 === 0 ? "#42734f" : "#2f573a";
    ctx.beginPath();
    ctx.moveTo(px - 6, -1);
    ctx.lineTo(px, -h);
    ctx.lineTo(px + 6, -1);
    ctx.closePath();
    ctx.fill();
  }

  const drawPetalLayer = (count, radiusX, petalW, petalH, offsetY, color) => {
    for (let i = 0; i < count; i++) {
      const t = (i / (count - 1)) * 2 - 1;
      const px = t * radiusX;
      const angle = t * 0.45;
      ctx.save();
      ctx.translate(px, offsetY);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, -petalH);
      ctx.quadraticCurveTo(petalW, -petalH * 0.4, 0, 4);
      ctx.quadraticCurveTo(-petalW, -petalH * 0.4, 0, -petalH);
      ctx.fill();
      ctx.restore();
    }
  };

  drawPetalLayer(7, 30, 8.8, 20, -3, pal.outer);
  drawPetalLayer(5, 20, 7.6, 23, -5, pal.inner);
  drawPetalLayer(3, 9, 6.5, 21, -6, pal.tip);

  ctx.strokeStyle = "#c99e7a";
  ctx.lineWidth = 1.4;
  [[-6, -42], [0, -45], [6, -42]].forEach(([ix, iy]) => {
    ctx.beginPath();
    ctx.moveTo(ix * 0.4, -12);
    ctx.lineTo(ix, iy);
    ctx.stroke();
    ctx.fillStyle = "#ff6b8b";
    ctx.beginPath();
    ctx.arc(ix, iy, 1.4, 0, Math.PI * 2);
    ctx.fill();
  });

  const candleGrad = ctx.createLinearGradient(-3, -32, 3, -10);
  candleGrad.addColorStop(0, "#fff0c2");
  candleGrad.addColorStop(1, "#e5a94c");
  ctx.fillStyle = candleGrad;
  ctx.beginPath();
  ctx.roundRect(-3, -32, 6, 22, 2);
  ctx.fill();

  const flickerX = Math.sin(time * 18 + phase) * 1.1;
  const flickerY = Math.cos(time * 23 + phase) * 1.2;

  const halo = ctx.createRadialGradient(0, -40, 2, 0, -40, 62);
  halo.addColorStop(0, "rgba(255, 240, 180, 0.88)");
  halo.addColorStop(0.38, "rgba(255, 190, 130, 0.3)");
  halo.addColorStop(1, "rgba(255, 160, 200, 0)");
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(0, -40, 62, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ffaa2b";
  ctx.beginPath();
  ctx.moveTo(0, -33);
  ctx.quadraticCurveTo(5.5, -39, flickerX, -49 + flickerY);
  ctx.quadraticCurveTo(-5.5, -39, 0, -33);
  ctx.fill();

  ctx.fillStyle = "#fffef7";
  ctx.beginPath();
  ctx.moveTo(0, -34);
  ctx.quadraticCurveTo(2.6, -38, flickerX * 0.6, -44 + flickerY * 0.6);
  ctx.quadraticCurveTo(-2.6, -38, 0, -34);
  ctx.fill();

  ctx.restore();

  if (label) {
    ctx.save();
    ctx.font = "400 12.5px 'Prompt', sans-serif";
    ctx.textAlign = "center";
    const textW = ctx.measureText(label).width + 22;
    const tagY = cy + bobY + 34 * scale;

    ctx.fillStyle = "rgba(22, 12, 38, 0.62)";
    ctx.strokeStyle = "rgba(255, 195, 225, 0.32)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(cx - textW / 2, tagY - 13, textW, 20, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#fff2f8";
    ctx.fillText(label, cx, tagY + 1);
    ctx.restore();
  }
}

function renderLoop(now) {
  const t = now * 0.001;
  const horizon = H * 0.48;

  const skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
  skyGrad.addColorStop(0, "#090617");
  skyGrad.addColorStop(0.52, "#1c1238");
  skyGrad.addColorStop(0.85, "#341e54");
  skyGrad.addColorStop(1, "#4a2866");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, horizon + 2);

  const nebula = ctx.createRadialGradient(W * 0.5, horizon * 0.5, 10, W * 0.5, horizon * 0.5, W * 0.55);
  nebula.addColorStop(0, "rgba(255, 180, 220, 0.14)");
  nebula.addColorStop(0.5, "rgba(180, 145, 255, 0.07)");
  nebula.addColorStop(1, "rgba(10, 6, 24, 0)");
  ctx.fillStyle = nebula;
  ctx.fillRect(0, 0, W, horizon);

  for (const s of stars) {
    s.a += s.s;
    const alpha = 0.22 + 0.75 * Math.abs(Math.sin(s.a));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.tint;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const moonX = W * 0.5;
  const moonY = horizon * 0.36;
  const moonR = Math.min(W, H) * 0.072;

  const corona = ctx.createRadialGradient(moonX, moonY, moonR * 0.45, moonX, moonY, moonR * 5.4);
  corona.addColorStop(0, "rgba(255, 246, 222, 0.72)");
  corona.addColorStop(0.28, "rgba(255, 210, 225, 0.22)");
  corona.addColorStop(0.62, "rgba(195, 165, 245, 0.08)");
  corona.addColorStop(1, "rgba(15, 10, 30, 0)");
  ctx.fillStyle = corona;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR * 5.4, 0, Math.PI * 2);
  ctx.fill();

  const moonDisc = ctx.createRadialGradient(moonX - moonR * 0.25, moonY - moonR * 0.25, moonR * 0.1, moonX, moonY, moonR);
  moonDisc.addColorStop(0, "#fffef9");
  moonDisc.addColorStop(0.82, "#ffedd1");
  moonDisc.addColorStop(1, "#f7d5b5");
  ctx.fillStyle = moonDisc;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
  ctx.fill();

  for (const l of skyLanterns) {
    l.x += l.vx + Math.sin(t + l.sway) * 0.00005;
    l.y += l.vy;
    if (l.y < -0.06) {
      l.y = 0.47;
      l.x = Math.random();
    }
    const lx = l.x * W;
    const ly = l.y * H;
    const r = 14 * l.z;

    const lg = ctx.createRadialGradient(lx, ly, 1, lx, ly, r * 2.3);
    lg.addColorStop(0, "rgba(255, 235, 185, 0.95)");
    lg.addColorStop(0.38, "rgba(255, 175, 130, 0.38)");
    lg.addColorStop(1, "rgba(255, 130, 160, 0)");
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.arc(lx, ly, r * 2.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 222, 165, 0.88)";
    ctx.beginPath();
    ctx.roundRect(lx - 3.5 * l.z, ly - 5 * l.z, 7 * l.z, 9 * l.z, 2);
    ctx.fill();
  }

  for (let i = fireworks.length - 1; i >= 0; i--) {
    const fw = fireworks[i];
    fw.x += fw.vx;
    fw.y += fw.vy;
    fw.vx *= 0.97;
    fw.vy *= 0.97;
    fw.vy += 0.015;
    fw.alpha -= 0.014;
    if (fw.alpha <= 0) {
      fireworks.splice(i, 1);
      continue;
    }
    ctx.globalAlpha = fw.alpha;
    ctx.fillStyle = fw.color;
    ctx.beginPath();
    ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = "#0e081f";
  ctx.beginPath();
  ctx.moveTo(0, horizon + 1);
  for (let x = 0; x <= W; x += 28) {
    const treeH = 11 + Math.sin(x * 0.016) * 7 + Math.cos(x * 0.04) * 5;
    ctx.lineTo(x, horizon - treeH);
  }
  ctx.lineTo(W, horizon + 1);
  ctx.closePath();
  ctx.fill();

  const waterGrad = ctx.createLinearGradient(0, horizon, 0, H);
  waterGrad.addColorStop(0, "#231942");
  waterGrad.addColorStop(0.3, "#161436");
  waterGrad.addColorStop(0.72, "#0c0c24");
  waterGrad.addColorStop(1, "#060614");
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, horizon, W, H - horizon);

  for (let y = horizon + 2; y < H; y += 3) {
    const p = (y - horizon) / (H - horizon);
    const waveOffset = Math.sin(y * 0.16 - t * 2.6) * (4 + p * 20) + Math.cos(y * 0.07 + t * 1.4) * 5;
    const bandW = moonR * (0.8 + p * 1.55) + Math.sin(y * 0.28 + t * 4.0) * 15;
    const shimmer = 0.5 + 0.5 * Math.sin(y * 0.35 + t * 5.2);
    const alpha = (1 - p * 0.82) * (0.06 + shimmer * 0.16);

    ctx.fillStyle = `rgba(255, 232, 205, ${alpha})`;
    ctx.fillRect(moonX - bandW * 0.5 + waveOffset, y, bandW, 1.8);
  }

  for (const pt of floatingPetals) {
    pt.x += pt.vx;
    pt.rot += 0.01;
    if (pt.x > W + 20) pt.x = -20;
    const py = pt.y + Math.sin(t * 2 + pt.x * 0.02) * 2;
    ctx.save();
    ctx.translate(pt.x, py);
    ctx.rotate(pt.rot);
    ctx.scale(1, 0.55);
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = 0.65;
    ctx.beginPath();
    ctx.ellipse(0, 0, pt.size, pt.size * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r += 1.35;
    rp.alpha *= 0.975;
    if (rp.alpha < 0.02) {
      ripples.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.scale(1, 0.36);
    ctx.strokeStyle = `rgba(255, 215, 235, ${rp.alpha})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(rp.x, rp.y / 0.36, rp.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  const players = roomState.players || {};
  const ids = Object.keys(players).slice(0, 2);
  const ks = roomState.krathongs || {};
  const released = roomState.released || {};
  const bothReleased = ids.length >= 2 && ids.every(id => released[id]);

  heroBoats[0].targetX = bothReleased ? 0.462 : 0.40;
  heroBoats[0].targetY = bothReleased ? 0.67 : 0.73;
  heroBoats[1].targetX = bothReleased ? 0.538 : 0.60;
  heroBoats[1].targetY = bothReleased ? 0.68 : 0.74;

  heroBoats.forEach(b => {
    b.x += (b.targetX - b.x) * 0.015;
    b.y += (b.targetY - b.y) * 0.015;
  });

  const baseScale = Math.max(0.88, Math.min(1.26, W / 700));

  if (ids.length === 0) {
    drawRealisticKrathong(ctx, W * 0.5, H * 0.73, baseScale, myFlower, "", t, 0);
  } else {
    ids.forEach((id, idx) => {
      const boat = heroBoats[idx];
      const fType = ks[id]?.type || (idx === 0 ? "lotus" : "sakura");
      const pName = players[id]?.name || "";
      const scaleMod = bothReleased ? baseScale * 0.92 : baseScale;
      drawRealisticKrathong(ctx, W * boat.x, H * boat.y, scaleMod, fType, pName, t, boat.phase);
    });

    if (bothReleased) {
      const midX = W * ((heroBoats[0].x + heroBoats[1].x) * 0.5);
      const midY = H * ((heroBoats[0].y + heroBoats[1].y) * 0.5) - 58 * baseScale + Math.sin(t * 2.5) * 4;
      drawHeartShape(ctx, midX, midY, 10, "#ff9ec7", 0.75 + 0.25 * Math.sin(t * 3));
    }
  }

  for (let i = floatingHearts.length - 1; i >= 0; i--) {
    const h = floatingHearts[i];
    h.x += h.vx + Math.sin(t * 3 + i) * 0.3;
    h.y += h.vy;
    h.alpha -= 0.008;
    if (h.alpha <= 0) {
      floatingHearts.splice(i, 1);
      continue;
    }
    drawHeartShape(ctx, h.x, h.y, h.size, "#ffb7d5", h.alpha);
  }

  for (const f of fireflies) {
    f.phase += f.speed;
    const fx = (f.x + Math.sin(f.phase * 0.6) * 0.03) * W;
    const fy = (f.y + Math.cos(f.phase * 0.8) * 0.02) * H;
    const glow = 0.25 + 0.75 * Math.abs(Math.sin(f.phase));
    ctx.fillStyle = `rgba(${f.color}, ${glow})`;
    ctx.beginPath();
    ctx.arc(fx, fy, 1.9, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

};

let audioCtx = null, soundPlaying = false, chimeTimer = null, streamNode = null, noteStep = 0;
$("btnSound").onclick = async () => {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    soundPlaying = !soundPlaying;

    if (soundPlaying) {
      $("btnSound").textContent = "เพลงกล่อม: เปิด";
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      streamNode = audioCtx.createBufferSource();
      streamNode.buffer = buf;
      streamNode.loop = true;
      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 240;
      const gain = audioCtx.createGain();
      gain.gain.value = 0.015;
      streamNode.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      streamNode.start();

      const melody = [523.25, 659.25, 783.99, 987.77, 880.0, 659.25, 587.33, 783.99];
      const playMusicBox = () => {
        if (!soundPlaying) return;
        const f = melody[noteStep % melody.length];
        noteStep++;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = f;
        o.connect(g);
        g.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.028, now + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
        o.start(now);
        o.stop(now + 1.85);
      };
      playMusicBox();
      chimeTimer = setInterval(playMusicBox, 1150);
    } else {
      $("btnSound").textContent = "เพลงกล่อม: ปิด";
      clearInterval(chimeTimer);
      if (streamNode) { streamNode.stop(); streamNode = null; }
    }
  } catch {
    showToast("เบราว์เซอร์นี้ไม่รองรับเสียง");
  }
};

$("btnSavePhoto").onclick = () => {
  try {
    const snap = document.createElement("canvas");
    snap.width = canvas.width;
    snap.height = canvas.height;
    const sctx = snap.getContext("2d");
    sctx.drawImage(canvas, 0, 0);

    sctx.save();
    sctx.scale(DPR, DPR);
    sctx.textAlign = "center";
    sctx.fillStyle = "#ffe6f2";
    sctx.font = "italic 34px 'Cormorant Garamond', Georgia, serif";
    sctx.fillText("Our Loy Krathong", W * 0.5, 56);

    const names = Object.values(roomState.players || {}).map(p => p.name).slice(0, 2);
    if (names.length) {
      sctx.font = "300 16px 'Prompt', sans-serif";
      sctx.fillStyle = "#ffe8c2";
      sctx.fillText(names.join("  ♡  "), W * 0.5, 84);
    }

    const wishText = $("wishText").textContent;
    if (wishText && wishText.startsWith("“")) {
      sctx.font = "300 16px 'Noto Serif Thai', serif";
      sctx.fillStyle = "#ffb7d5";
      sctx.fillText(wishText, W * 0.5, H - 36);
    }
    sctx.restore();

    const a = document.createElement("a");
    a.download = `our-loy-krathong-${room || "love"}.png`;
    a.href = snap.toDataURL("image/png");
    a.click();
    showToast("บันทึกภาพความทรงจำของเราแล้ว ♡");
  } catch {
    showToast("ไม่สามารถบันทึกภาพได้");
  }
};
</script>
</body>
</html>
